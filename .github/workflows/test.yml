name: "Test"

on:
  workflow_dispatch:
    inputs:
      a:
        description: "Payload from Zendesk"
        required: true
        type: string

jobs:
  job:
    runs-on: ubuntu-latest
    steps:
      - uses: hmarr/debug-action@v3.0.0

      - uses: actions/checkout@v4

      - id: id
        uses: actions/github-script@v7
        env:
          RELEASE_OVERRIDE_VALUES: |
            global:
              extraEnvironmentVars:
                FEATURE_FLAGS_OFFLINE: true
                FEATURE_FLAGS_FROM_FILE: true
            app:
              tolerations: null
              affinity: null
            rqworker:
              tolerations: null
              affinity: null
        with:
          script: |
            const release_override_values = process.env.RELEASE_OVERRIDE_VALUES;
            core.setOutput('override_values', release_override_values)

      - uses: ./.github/actions/action
        with:
          override_values: "${{ steps.id.outputs.override_values }}"
