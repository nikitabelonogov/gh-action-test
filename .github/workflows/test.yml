name: 'TEST'

on:
  push:

jobs:
  build_wheels:
    name: "Build musl wheels and upload to Nexus (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm ]
    container:
      image: python:3.13-alpine
    steps:
      - name: Install Build Dependencies
        run: |
          apk add --no-cache build-base gfortran linux-headers libgomp openblas-dev lapack-dev

      - name: Build Wheels
        run: |
          python -m pip wheel scikit-learn==1.7.2 opencv-python==4.12.0.88 -w dist/
          ls dist/

      - name: Upload to Nexus
        if: always()
        env:
          NEXUS_URL: https://nexus.appx.humansignal.com/repository/alpine/
          TWINE_USERNAME: admin
          TWINE_PASSWORD: admin
        run: |
          python -m pip install -U twine
          python -m twine upload --repository-url "${NEXUS_URL}" dist/*.whl
