name: "test"

on:
  push:

jobs:
  details:
    name: "test"
    runs-on: ubuntu-latest
    steps:
      - uses: hmarr/debug-action@v3.0.0

      - name: Checkout Actions Hub
        uses: actions/checkout@v4

      - name: Pull develop and fb-test branches
        run: |
          echo "==> branches"
          git branch -a
          
          echo "==> develop"
          git -c protocol.version=2 fetch --no-tags --no-recurse-submodules origin develop:refs/remotes/origin/develop
          git checkout --progress --force -B develop refs/remotes/origin/develop

          echo "==> branches"
          git branch -a
          
          echo "==> fb-test"
          git -c protocol.version=2 fetch --no-tags --no-recurse-submodules origin fb-test:refs/remotes/origin/fb-test
          git checkout --progress --force -B fb-test refs/remotes/origin/fb-test
          
          echo "==> branches"
          git branch -a

      - name: merge base
        shell: bash
        continue-on-error: true
        run: git merge-base fb-test develop

      - name: Log develop
        shell: bash
        continue-on-error: true
        run: git log --oneline develop

      - name: Log fb-test
        shell: bash
        continue-on-error: true
        run: git log --oneline fb-test

