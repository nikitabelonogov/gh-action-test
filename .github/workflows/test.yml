name: "SaaS: Release Pipeline"

on:
  schedule:
    - cron: '0 16 * * 1-5' # every weekday at 16:00 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: 'Full commit SHA'
        required: true
        default: ''
        type: string
      deploy_to_prod:
        type: boolean
        required: true
        default: true
        description: 'Deploy LSE SaaS'
      dismiss_failed_tests:
        type: boolean
        required: false
        description: 'Ignore all required checks'
      sure:
        type: string
        required: false
        description: 'Type "sure" if you understand your responsibility'
      deploy_adala:
        type: boolean
        required: false
        default: true
        description: '🔀 Deploy Adala'

env:
  REQUIRED_CHECKS: "Tests / Selenium (RunTest), Docker image tag"
  PYTHON_VERSION_FILE: "pyproject.toml"
  DOCKER_IMAGE_TAG_CHECK_NAME: "Docker image tag"
  IMAGE_NAME: "${{ vars.DOCKERHUB_ORG }}/label-studio-enterprise"

jobs:
  release_pipeline:
    name: "Create tag and release"
    outputs:
      release_version: ${{ steps.calculate_version.outputs.release_version }}
      next_dev_tag: ${{ steps.calculate_version.outputs.next_dev_tag }}
      latest_dev_tag: ${{ steps.calculate_version.outputs.latest_dev_tag }}
      current_tag: ${{ steps.docker_build_info.outputs.image_version }}
      branch: ${{ steps.docker_build_info.outputs.branch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: hmarr/debug-action@v3.0.0

      - if: github.event_name == 'schedule'
        name: "Validate: ref is not empty"
        shell: bash
        run: |
          set -xeuo pipefail
          if [ -z "${{ inputs.ref }}" ]; then
            echo "Please provide commit sha"
            exit 1
          fi

      - name: "Validate: full SHA1 sum"
        shell: bash
        run: |
          set -xeuo pipefail
          if echo ${{ inputs.ref }} | grep -q -E "^[0-9a-f]{40}$"; then
            exit 0
          else
            echo "Please provide full commit sha it should be 40 chars length"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_PAT }}
          ref: ${{ inputs.ref }}
          submodules: 'recursive'
          fetch-depth: 0

      - name: Checkout Actions Hub
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_PAT }}
          repository: HumanSignal/actions-hub
          path: ./.github/actions-hub

      - name: Team details
        id: team_details
        uses: ./.github/actions-hub/actions/team-details
        with:
          jira-server: "${{ vars.JIRA_SERVER }}"
          jira-username: "${{ secrets.JIRA_USERNAME }}"
          jira-token: "${{ secrets.JIRA_TOKEN }}"
          github_token: "${{ secrets.GIT_PAT }}"
        continue-on-error: true

      - name: "Validate: base_branch contains a commit"
        shell: bash
        run: |
          set -xeuo pipefail
          if git branch -r --contains ${{ inputs.ref }} | grep -q ${{ github.event.repository.default_branch }}; then
            exit 0
          else
            echo "Commit ${{ inputs.ref }} wasn't found in ${{ github.event.repository.default_branch }} branch"
            exit 1
          fi

      - name: "Validate: required gh checks"
        uses: actions/github-script@v7
        continue-on-error: ${{ inputs.dismiss_failed_tests }}
        env:
          REQUIRED_CHECKS: ${{ env.REQUIRED_CHECKS }}
          REF: ${{ inputs.ref }}
        with:
          github-token: ${{ secrets.GIT_PAT }}
          script: |
            const {repo, owner} = context.repo;
            const ref = process.env.REF;
            const required_checks_names = process.env.REQUIRED_CHECKS.split(',').map(e => e.trim())
            core.info("Required checks: " + required_checks_names)
            
            const all_check_runs = await github.paginate(
                github.rest.checks.listForRef,
                {
                    owner,
                    repo,
                    ref: ref,
                    per_page: 100
                },
                (response) => response.data
            )
            
            for (const check_name of required_checks_names) {
                const check = all_check_runs.find(e => e.name === check_name)
                if (check) {
                    const check_msg = `Check "${check.name}" is ${check.status}, ${check.conclusion} : ${check.html_url}`
                    if (check.status === 'completed' && check.conclusion === 'success') {
                        core.info(check_msg)
                    } else {
                        core.setFailed(check_msg)
                    }
                } else {
                    core.setFailed(`No runs for check "${check_name}" was found`)
                }
            }

      - name: Get an artifact from check suite
        uses: actions/github-script@v7
        id: docker_build_info
        env:
          REF: "${{ inputs.ref }}"
        with:
          github-token: ${{ secrets.GIT_PAT }}
          script: |
            const {repo, owner} = context.repo;
            const check_runs = await github.paginate(
              github.rest.checks.listForRef,
              {
                owner,
                repo,
                ref: process.env.REF,
                status: "completed",
                per_page: 100
              },
              (response) => response.data
            );
            const check = check_runs.find(e => e.name === '${{ env.DOCKER_IMAGE_TAG_CHECK_NAME }}')
            const details = JSON.parse(check.output.summary)
            let branch = details.branch
            const match = branch.match(/gh-readonly-queue\/(.*?)\/pr-/);
            if (match) {
              branch = match[1];
            }
            console.log(details)
            core.setOutput("branch", branch)
            core.setOutput("pretty_branch_name", details.pretty_branch_name);
            core.setOutput("image_version", details.image_version);
            core.setOutput("sha", details.sha);
            core.setOutput("image_name", "${{ env.IMAGE_NAME }}");

      - name: "Validate: Release restricted"
        run: |
          if [ "${{ vars.BLOCK_SAAS_RELEASE }}" = "activated" ]; then
            echo "::error::SaaS release is not allowed right now. Stopping the job."
            exit 1
          fi

      - name: Configure git
        shell: bash
        run: |
          set -xeuo pipefail
          git config --global user.name 'robot-ci-heartex'
          git config --global user.email 'robot-ci-heartex@users.noreply.github.com'

      - name: Calculate version
        id: calculate_version
        shell: bash
        run: |
          set -xeuo pipefail
          
          main_release_version=$(sed -n 's#^version[ ]\+=[ ]\+"\([0-9]\+\)\.\([0-9]\+\)\.\([0-9]\+\).*#\1.\2.\3#p' '${{ env.PYTHON_VERSION_FILE }}')
          
          if latest_dev_tag=$(git tag -l | grep "${main_release_version}" | grep "\.dev" | sort -V | tail -n1); then
            latest_dev_number=$(echo "${latest_dev_tag}" | cut -d '-' -f2 | cut -d 'v' -f2)
            release_version="${main_release_version}.dev$((${latest_dev_number} + 1))"
            next_dev_tag="${main_release_version}.dev$((${latest_dev_number} + 2))"
          else
            release_version="${main_release_version}.dev0"
            next_dev_tag="${main_release_version}.dev1"
            latest_dev_tag=$(git tag -l | grep "\.dev" | sort -V | tail -n1)
          fi
          
          echo "release_version=${release_version}" >> $GITHUB_OUTPUT
          echo "next_dev_tag=${next_dev_tag}" >> $GITHUB_OUTPUT
          echo "latest_dev_tag=tags/${latest_dev_tag}" >> $GITHUB_OUTPUT

      - name: Set Jira fix version
        id: jira-fixversion
        uses: ./.github/actions-hub/actions/jira-set-fix-version
        continue-on-error: true
        with:
          github_token: "${{ secrets.GIT_PAT }}"
          github_repository: "${{ github.repository }}"
          github_previous_ref: "${{ steps.calculate_version.outputs.latest_dev_tag }}"
          github_current_ref: "${{ inputs.ref }}"
          jira_server: "${{ vars.JIRA_SERVER }}"
          jira_username: "${{ secrets.JIRA_USERNAME }}"
          jira_token: "${{ secrets.JIRA_TOKEN }}"
          jira_fix_version: "LSE SaaS/${{ steps.calculate_version.outputs.release_version }}"
          jira_fix_version_released: true

      - name: Generate release changelog
        id: changelog_md
        uses: ./.github/actions-hub/actions/github-generate-changelog
        with:
          release_version: "${{ steps.calculate_version.outputs.release_version }}"
          previous_ref: "${{ steps.calculate_version.outputs.latest_dev_tag }}"
          current_ref: "${{ inputs.ref }}"
          github_token: "${{ secrets.GIT_PAT }}"
          jira_server: "${{ vars.JIRA_SERVER }}"
          jira_username: "${{ secrets.JIRA_USERNAME }}"
          jira_token: "${{ secrets.JIRA_TOKEN }}"
          jira_release_prefix: "LSE SaaS"
          launchdarkly_path: "label_studio_enterprise/feature_flags.json"
          launchdarkly_environment: "production"
          helm_chart_repo: "HumanSignal/charts"
          helm_chart_path: "heartex/label-studio/Chart.yaml"

      - name: Create release
        uses: actions/github-script@v7
        id: create-release
        with:
          script: |
            try {
              const response = await github.rest.repos.createRelease({
                draft: false,
                body: atob(`${{ steps.changelog_md.outputs.changelog_msg_b64 }}`),
                name: '${{ steps.calculate_version.outputs.release_version }}',
                owner: context.repo.owner,
                prerelease: true,
                repo: context.repo.repo,
                target_commitish: '${{ inputs.ref }}',
                tag_name: '${{ steps.calculate_version.outputs.release_version }}',
              });
              return response;
            } catch (error) {
              core.setFailed(error.message);
            }

      - name: Prepare Slack message
        id: prepare-slack-message
        uses: actions/github-script@v7
        env:
          PR_BODY: '${{ github.event.pull_request.body }}'
          COMMIT_MESSAGE: '${{ github.event.head_commit.message }}'
          JIRA_RELEASE_ISSUES_JQL_URL: "${{ steps.jira-fixversion.outputs.issues_jql_url }}"
          WORKFLOW_RUN_LINK: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        with:
          github-token: ${{ secrets.GIT_PAT }}
          script: |
            const { repo, owner } = context.repo;
            const user_details = ${{ steps.team_details.outputs.details || '[]' }};
            const changelog = ${{ env.CHANGELOG_JSON }};
            const jira_release_issues_jql_url = process.env.JIRA_RELEASE_ISSUES_JQL_URL;
            const workflow_run_link = process.env.WORKFLOW_RUN_LINK;
            const tasks_map = changelog.sorted_release_tasks
            const user = user_details.find(e => e.github.username === '${{ github.actor }}');
            const slack_message_lines = [];
            let slack_message_line = 'SaaS Release *<https://github.com/${{ github.repository }}/releases/tag/${{ steps.calculate_version.outputs.release_version }}|${{ steps.calculate_version.outputs.release_version }}>* is out!';
            if (user) {
              slack_message_line += ` <@${user.slack.userid}>`;
            }
            slack_message_lines.push(slack_message_line);
            for (let [label, tasks] of Object.entries(tasks_map)) {
              for (let task of tasks) {
                let commit_line = `- ${task.desc} <${task.link}|${task.key}>`;
                if (task.pr && task.pr !== '') {
                  const {data: issue} = await github.rest.issues.get({
                    owner,
                    repo,
                    issue_number: task.pr,
                  });
                  let githubUser = issue.user.login;
                  if (issue.assignee) {
                    githubUser = issue.assignee.login;
                  }
                  const user = user_details.find(e => e.github.username === githubUser);
                  if (user) {
                    commit_line += ` <@${user.slack.userid}>`;
                  }
                }
                if (task.ffs && task.ffs.length > 0) {
                  commit_line += ' ff is';
                  for (let ff of task.ffs) {
                    commit_line += ` <${ff.link}|${ff.status}>`;
                  }
                }
                slack_message_lines.push(commit_line);
              }
            }
            if (jira_release_issues_jql_url) {
              slack_message_lines.push(`><${jira_release_issues_jql_url}|[Jira Release Issues JQL Filter]>`);
            }
            slack_message_lines.push(`><${workflow_run_link}|[Workflow run]>`);
            core.setOutput("slack_message_text", slack_message_lines.join('\n'));
            core.setOutput("slack_message_text_single_line", slack_message_lines.join('\\n'));

      - name: Notify to Slack on release
        id: slack_notify_ops_release
        uses: slackapi/slack-github-action@v1.27
        with:
          channel-id: '${{ vars.SLACK_CH_RELEASE_TRAIN }}'
          slack-message: ${{ steps.prepare-slack-message.outputs.slack_message_text }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_LSE_BOT_TOKEN }}

  set-version-default-branch:
    name: 'Set version in default branch'
    uses: ./.github/workflows/on_premise-set-version.yml
    needs:
      - release_pipeline
    with:
      version: ${{ needs.release_pipeline.outputs.next_dev_tag }}
      branch: ${{ github.event.repository.default_branch }}
    permissions:
      contents: write
    secrets: inherit

  promote_docker_image:
    name: "Promote docker image"
    needs:
      - release_pipeline
    permissions:
      contents: read
      checks: read
    uses: ./.github/workflows/docker-release-promote.yml
    with:
      image_tag: "${{ needs.release_pipeline.outputs.current_tag }}"
      release_tag: "${{ needs.release_pipeline.outputs.release_version }}"
      sha: "${{ inputs.ref }}"
      branch_override: "${{ needs.release_pipeline.outputs.branch }}"
    secrets: inherit

  deploy_us_lse:
    name: "Deploy LSE to US PROD k8s"
    uses: ./.github/workflows/argocd-deploy.yml
    if: inputs.deploy_to_prod && contains(inputs.sure, 'sure')
    needs:
      - release_pipeline
      - promote_docker_image
    permissions:
      id-token: write
      contents: read
      deployments: write
    with:
      release_name: "prod"
      template_name: "lse"
      cluster: "app.heartex.com"
      namespace: "prod-lse"
      docker_image_version: "${{ needs.promote_docker_image.outputs.image_tag }}"
    secrets: inherit

  deploy_eu_lse:
    name: "Deploy LSE to EU PROD k8s"
    uses: ./.github/workflows/argocd-deploy.yml
    if: inputs.deploy_to_prod && contains(inputs.sure, 'sure')
    needs:
      - deploy_us_lse
      - release_pipeline
      - promote_docker_image
    permissions:
      id-token: write
      contents: read
      deployments: write
    with:
      release_name: "eu-prod"
      template_name: "lse"
      cluster: "app.humansignal.eu"
      namespace: "eu-prod-lse"
      docker_image_version: "${{ needs.promote_docker_image.outputs.image_tag }}"
    secrets: inherit

  deploy_adala:
    name: "Deploy Adala to US and EU PROD k8s"
    uses: ./.github/workflows/deploy-argocd-prod-adala.yml
    if: inputs.deploy_adala && inputs.deploy_to_prod && contains(inputs.sure, 'sure')
    needs:
      - deploy_eu_lse
    secrets: inherit

  move_tasks_to_delivered:
    name: "Move Tasks to Delivered"
    needs:
      - release_pipeline
      - deploy_us_lse
      - deploy_eu_lse
    permissions:
      contents: read
      pull-requests: read
    if: inputs.deploy_to_prod && contains(inputs.sure, 'sure')
    uses: ./.github/workflows/jira_move_to_delivered.yml
    with:
      release_ref: "${{ needs.release_pipeline.outputs.release_version }}"
      previous_ref: "${{ needs.release_pipeline.outputs.latest_dev_tag }}"
    secrets: inherit

  deploy_prod:
    name: "Deploy to ec2 prod"
    uses: ./.github/workflows/deploy-prod.yml
    if: inputs.deploy_to_prod && contains(inputs.sure, 'sure')
    needs:
      - move_tasks_to_delivered
      - release_pipeline
    permissions:
      contents: read
      deployments: write
    with:
      image_version: ${{ needs.release_pipeline.outputs.release_version }}
      are_you_sure: true
    secrets: inherit

