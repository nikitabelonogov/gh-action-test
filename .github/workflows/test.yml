name: "External Check"

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: "Cluster name"
        required: false
        default: "dev.heartex.com"
        type: string


permissions:
  contents: read
  checks: write

jobs:
  external_check:
    name: "External Check"
    runs-on: ubuntu-latest
    steps:
      - uses: hmarr/debug-action@v3.0.0

      - id: details
        run: |
          case "${{ inputs.cluster }}" in
            'dev.heartex.com')
              echo "argocd_url=argocd.appx.humansignal.com" >> "${GITHUB_OUTPUT}"
              echo "argocd_token=${{ secrets.ARGOCD_DEV_TOKEN }}" >> "${GITHUB_OUTPUT}"
              echo "grafana_url=grafana.appx.humansignal.com" >> "${GITHUB_OUTPUT}"
              ;;
            'app.heartex.com')
              echo "argocd_url=argocd.humansignal.com" >> "${GITHUB_OUTPUT}"
              echo "argocd_token=${{ secrets.ARGOCD_US_PROD_TOKEN }}" >> "${GITHUB_OUTPUT}"
              echo "grafana_url=grafana.humansignal.com" >> "${GITHUB_OUTPUT}"
              ;;
            'app.humansignal.eu')
              echo "argocd_url=argocd.appx.humansignal.com" >> "${GITHUB_OUTPUT}"
              echo "argocd_token=${{ secrets.ARGOCD_EU_PROD_TOKEN }}" >> "${GITHUB_OUTPUT}"
              echo "grafana_url=grafana.appx.humansignal.com" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "Unknown cluster"
              exit 1
          esac

      - run: |
          echo "${{ steps.details.outputs.argocd_url }}"
          echo "${{ steps.details.outputs.argocd_token }}"
          echo "${{ steps.details.outputs.grafana_url }}"
