name: "test"

on:
  push:

jobs:
  details:
    name: "test"
    runs-on: ubuntu-latest
    steps:
      - uses: hmarr/debug-action@v3.0.0

      - name: Checkout Actions Hub
        uses: actions/checkout@v4

      - name: Git Merge
        uses: ./.github/actions/git-merge
        with:
          base_branch: "develop"
          head_branch: "branch"

      - name: Log
        run: |
          git log --oneline -n 5 develop
          git log --oneline -n 5 branch
          git branch -a
