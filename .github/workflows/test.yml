name: 'TEST'

on:
  push:

env:
  POETRY_VERSION: 2.1.4

jobs:
  get:
    runs-on: ubuntu-latest
    outputs:
      requirements: ${{ steps.gen-req.outputs.requirements }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: "Humansignal/label-studio-enterprise"
          ref: fb-PLT-841
          token: ${{ secrets.GIT_PAT }}

      - name: "Install poetry"
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"

      - name: "Install poetry-plugin-export"
        run: poetry self add poetry-plugin-export

      - name: Generate requirements.txt
        id: gen-req
        run: |
          poetry export -f requirements.txt --without-hashes --output=requirements.txt
          sed -i 's/ ; .*//g' requirements.txt
          cat requirements.txt
          echo "requirements<<EOF" >> $GITHUB_OUTPUT
          cat requirements.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  build_wheels:
    name: "Build musl wheels and upload to Nexus (${{ matrix.os }})"
    needs: get
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm ]
    container:
      image: python:3.13-alpine
    steps:
      - name: Install Build Dependencies
        run: |
          apk add --no-cache build-base gfortran linux-headers libgomp openblas-dev lapack-dev geos-dev openldap-dev librdkafka-dev

      - name: Create requirements.txt
        run: echo "${{ needs.get.outputs.requirements }}" > requirements.txt

      - name: Build Wheels
        env:
          NEXUS_URL: https://nexus.appx.humansignal.com/repository/alpine/
        run: |
          cat requirements.txt
          python -m pip wheel -r requirements.txt -w dist/ --extra-index-url "${NEXUS_URL}"
          ls dist/

      - name: Upload to Nexus
        if: always()
        env:
          NEXUS_URL: https://nexus.appx.humansignal.com/repository/alpine/
          TWINE_USERNAME: admin
          TWINE_PASSWORD: admin
        run: |
          python -m pip install -U twine
          python -m twine upload --repository-url "${NEXUS_URL}" dist/*.whl
