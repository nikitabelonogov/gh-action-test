name: "test"

on:
  push:

jobs:
  details:
    name: "test"
    runs-on: ubuntu-latest
    steps:
      - uses: hmarr/debug-action@v3.0.0

      - name: Checkout Actions Hub
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_PAT }}
          repository: HumanSignal/actions-hub
          path: ./.github/actions-hub

      - name: Team details
        id: team_details
        uses: ./.github/actions-hub/actions/team-details
        with:
          jira-server: "${{ vars.JIRA_SERVER }}"
          jira-username: "${{ secrets.JIRA_USERNAME }}"
          jira-token: "${{ secrets.JIRA_TOKEN }}"
          github_token: "${{ secrets.GIT_PAT }}"
        continue-on-error: true
  
      - name: Generate release changelog
        id: changelog
        uses: ./.github/actions-hub/actions/github-changelog
        with:
          repository: "HumanSignal/label-studio-enterprise"
          release_version: "2.26.0.dev22"
          previous_ref: "tags/2.26.0.dev21"
          current_ref: "c1036fb96252b3a1a85d54c9cd8cdf1f159bc60a"
          github_token: "${{ secrets.GIT_PAT }}"
          jira_server: "${{ vars.JIRA_SERVER }}"
          jira_username: "${{ secrets.JIRA_USERNAME }}"
          jira_token: "${{ secrets.JIRA_TOKEN }}"
          jira_release_prefix: "LSE OnPrem"
          launchdarkly_path: "label_studio_enterprise/feature_flags.json"
          launchdarkly_environment: "production"
          helm_chart_repo: "HumanSignal/charts"
          helm_chart_path: "heartex/label-studio/Chart.yaml"
          user_details: "${{ steps.team_details.outputs.details }}"
  
      - name: Create release
        uses: actions/github-script@v7
        id: create-release
        env:
          CHANGELOG: "${{ steps.changelog.outputs.changelog }}"
        with:
          script: |
            const changelog = process.env.CHANGELOG;
            console.log(changelog);
            core.info(changelog);
  
      - name: Notify to Slack on release
        uses: slackapi/slack-github-action@v2
        env:
          MENTION: "<@${{ steps.team_details.outputs.slack-user-id }}>"
          CHANGELOG: "${{ steps.changelog.outputs.slack_notification }}"
          RELEASE: "<https://github.com/${{ github.repository }}/releases/tag/2.26.0.dev22|2.26.0.dev22>"
          JIRA: "<${{ steps.changelog.outputs.jira_releases_issues_jql_url }}|jira issues>"
          WORKFLOW: "<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|workflow>"
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_LSE_BOT_TOKEN }}
          payload: |
            channel: "C05KTGCDXEU"
            text: "${{ github.event_name == 'schedule' && '*Scheduled* ' || '' }}SaaS Release *<https://github.com/${{ github.repository }}/releases/tag/${{ steps.create-release.outputs.tag }}|${{ steps.create-release.outputs.tag }}>* is out! ${{ env.MENTION }}\n${{ env.CHANGELOG }}\n[ ${{ env.RELEASE }} ${{ env.JIRA }} ${{ env.WORKFLOW }} ]"
