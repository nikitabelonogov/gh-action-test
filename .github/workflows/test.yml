name: "test"

on:
  push:

jobs:
  details:
    name: "test"
    runs-on: ubuntu-latest
    steps:
      - uses: hmarr/debug-action@v3.0.0

      - name: Checkout Actions Hub
        uses: actions/checkout@v4

      - name: Pull develop and fb-test branches
        run: |
          git fetch origin develop
          git fetch --unshallow origin fb-test
          git checkout fb-test
          git pull origin fb-test

      - name: Log branches
        shell: bash
        continue-on-error: true
        run: git branch -a

      - name: Log develop
        shell: bash
        continue-on-error: true
        run: git log --oneline develop

      - name: Log fb-test
        shell: bash
        continue-on-error: true
        run: git log --oneline fb-test

