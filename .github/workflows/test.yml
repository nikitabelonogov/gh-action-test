name: "test"

on:
  push:

jobs:
  details:
    name: "test"
    runs-on: ubuntu-latest
    steps:
      - uses: hmarr/debug-action@v3.0.0

      - name: Checkout Actions Hub
        uses: actions/checkout@v4

      - name: Git Merge
        uses: ./.github/actions/git-merge
        continue-on-error: true
        with:
          base_branch: "develop"
          head_branch: "fb-test"

      - name: Log branches
        continue-on-error: true
        run: git branch -a

      - name: Log develop
        continue-on-error: true
        run: git log --oneline develop

      - name: Log fb-test
        continue-on-error: true
        run: git log --oneline fb-test
