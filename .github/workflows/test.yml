name: Claude Coverage & Test Generation

on:
  workflow_dispatch:

jobs:
  generate-tests:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      actions: read

    steps:
      - uses: hmarr/debug-action@v3.0.0

      - name: Run Claude Code for Test Generation
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_CI_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 5
            --model claude-sonnet-4-5-20250929
            --allowedTools Read,Write,Edit,Bash,Glob,Grep,Task
          prompt: |
            ## Step 1: Say Hello to the World
            
            ## Step 2: Say something interesting about the world

      - run: ls
        continue-on-error: true

      - run: ls .claude
        continue-on-error: true

      - run: ls .claude/logs
        continue-on-error: true

      - name: Archive Claude Logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: claude-logs
          path: .claude/logs
          retention-days: 1
