name: "Test"

on:
  push:
    branches:
      - develop

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: hmarr/debug-action@v3.0.0

      - name: Checkout Actions Hub
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_PAT }}
          repository: HumanSignal/actions-hub
          path: ./.github/actions-hub

      - name: Get Upstream PRs
        uses: ./.github/actions-hub/actions/follow-merge-upstream-prs
        id: upstream-prs
        with:
          branch_name: "fb-dia-1939"
          repository: "HumanSignal/label-studio-enterprise"
          poetry_repositories: "label-studio"
          infra_repositories: ""
          github_token: "${{ secrets.GIT_PAT }}"

      - run: |
          echo "${{ steps.upstream-prs.outputs.shas }}"
          echo "${{ steps.upstream-prs.outputs.status }}"
          echo "${{ steps.upstream-prs.outputs.base_branch_name }}"
          echo "${{ steps.upstream-prs.outputs.assignees }}"
          echo "${{ steps.upstream-prs.outputs.author_username }}"
