name: "Test"

on:
  workflow_dispatch:
    inputs:
      a:
        description: "Payload from Zendesk"
        required: true
        type: string

jobs:
  job:
    runs-on: ubuntu-latest
    steps:
      - uses: hmarr/debug-action@v3.0.0

      - uses: actions/checkout@v4

      - id: id
        uses: actions/github-script@v7
        with:
          script: |
            const a = 'a';
            const release_override = `
            global:
              extraEnvironmentVars:
                FEATURE_FLAGS_OFFLINE: true
                FEATURE_FLAGS_FROM_FILE: true
            app:
              tolerations: null
              affinity: null
            rqworker:
              tolerations: null
              affinity: null
            `;
            
            if ( a === 'a') {
              core.setOutput('override', release_override)
            } else {
              core.setOutput('override', '')
            }
            

      - uses: ./.github/actions/action
        with:
          override_values: "${{ steps.id.outputs.override }}"
