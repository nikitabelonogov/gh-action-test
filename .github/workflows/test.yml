name: "test"

on:
  push:

jobs:
  details:
    name: "test"
    runs-on: ubuntu-latest
    steps:
      - uses: hmarr/debug-action@v3.0.0

      - name: Checkout Actions Hub
        uses: actions/checkout@v4

      - name: get merge base
        uses: actions/github-script@v7
        id: get-merge-base
        env:
          HEAD_BRANCH: "${{ github.ref_name }}"
          BASE_BRANCH: "develop"
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          script: |
            const {data: compare} = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: process.env.BASE_BRANCH,
              head: process.env.HEAD_BRANCH,
            });
            core.SetOutput('merge_base', compare.merge_base_commit.sha);
            core.SetOutput('behind', compare.behind_by);
            core.SetOutput('ahead', compare.ahead_by);

      - name: Pull develop and fb-test branches
        env:
          HEAD_BRANCH: "${{ github.ref_name }}"
        run: |
          echo "==> Show all branches"
          git branch -a
          
          echo "==> Fetching develop"
          git fetch --no-tags --no-recurse-submodules --depth=${{ steps.get-merge-base.outputs.behind }} --progress origin develop
          git checkout --force -B develop origin/develop

          echo "==> Fetching ${HEAD_BRANCH} (full history)"
          git fetch --no-tags --no-recurse-submodules --depth=${{ steps.get-merge-base.outputs.ahead }} origin "${HEAD_BRANCH}"
          git checkout --force -B "${HEAD_BRANCH}" "origin/${HEAD_BRANCH}"

          echo "==> Final branch list"
          git branch -a

      - name: Log develop
        shell: bash
        continue-on-error: true
        run: git log --oneline develop

      - name: Log head branch
        shell: bash
        continue-on-error: true
        run: git log --oneline "${{ github.ref_name }}"

      - name: merge base
        shell: bash
        run: git merge-base fb-test develop

